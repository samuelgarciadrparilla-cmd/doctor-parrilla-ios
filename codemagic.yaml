workflows:
  ios-release:
    name: iOS Release to App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
        - firebase_credentials
      vars:
        BUNDLE_ID: "com.drparrilla.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Inject GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - drparrillaparaguay@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

  android-release:
    name: Android Release to Play Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      groups:
        - firebase_credentials
        - android_signing
      vars:
        PACKAGE_NAME: "com.drparrilla.paraguay"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Inject google-services.json
        script: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
      - name: Inject keystore and key.properties
        script: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-key.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/upload-key.jks
          EOF
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate launcher icons
        script: |
          flutter pub run flutter_launcher_icons
      - name: Build AAB
        script: |
          flutter build appbundle --release
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - drparrillaparaguay@gmail.com
        notify:
          success: true
          failure: true

  screenshots:
    name: App Store Screenshots
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase_credentials
      vars:
        BUNDLE_ID: "com.drparrilla.app"
        PHONE: "0991123456"
        BASE_URL: "https://drparrillaparaguay.com"
    scripts:
      - name: Inject GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build for simulator
        script: |
          flutter build ios --simulator --dart-define=SCREENSHOT_URL="${BASE_URL}/?phone=${PHONE}"
      - name: Screenshots - iPhone 16 Pro Max (6.9")
        script: |
          set -e
          xcrun simctl shutdown all 2>/dev/null || true
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "
          import sys, json
          rts = [r for r in json.load(sys.stdin)['runtimes'] if 'iOS' in r['name'] and r['isAvailable']]
          print(sorted(rts, key=lambda x: x['version'])[-1]['identifier'])
          ")
          UDID=$(xcrun simctl create "ss-69" "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app

          OUTDIR="$CM_BUILD_DIR/screenshots/iphone_69"
          mkdir -p "$OUTDIR"

          # Pre-grant notification permission to avoid popup blocking screenshots
          xcrun simctl privacy "$UDID" grant notifications "$BUNDLE_ID" 2>/dev/null || true

          take_screenshot() {
            local URL="$1" NAME="$2"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            sleep 1
            # Pass phone directly in URL for auto-login
            local URL_WITH_PHONE="${URL}?phone=${PHONE}"
            xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" "flutter.screenshot_url" "$URL_WITH_PHONE"
            xcrun simctl launch "$UDID" "$BUNDLE_ID"
            sleep 28
            xcrun simctl io "$UDID" screenshot "$OUTDIR/${NAME}.png" \
              || (sleep 10 && xcrun simctl io "$UDID" screenshot "$OUTDIR/${NAME}.png")
          }

          take_screenshot "$BASE_URL/"          "1_home"
          take_screenshot "$BASE_URL/catalogo"  "2_catalogo"
          take_screenshot "$BASE_URL/catalogo"  "3_detalle"
          take_screenshot "$BASE_URL/pedidos"   "4_pedidos"
          take_screenshot "$BASE_URL/perfil"    "5_perfil"

          xcrun simctl shutdown "$UDID"
          xcrun simctl delete "$UDID"
      - name: Screenshots - iPhone 11 Pro Max (6.5")
        script: |
          set -e
          xcrun simctl shutdown all 2>/dev/null || true
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "
          import sys, json
          rts = [r for r in json.load(sys.stdin)['runtimes'] if 'iOS' in r['name'] and r['isAvailable']]
          print(sorted(rts, key=lambda x: x['version'])[-1]['identifier'])
          ")
          UDID=$(xcrun simctl create "ss-65" "com.apple.CoreSimulator.SimDeviceType.iPhone-11-Pro-Max" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app

          OUTDIR="$CM_BUILD_DIR/screenshots/iphone_65"
          mkdir -p "$OUTDIR"

          # Pre-grant notification permission to avoid popup blocking screenshots
          xcrun simctl privacy "$UDID" grant notifications "$BUNDLE_ID" 2>/dev/null || true

          take_screenshot() {
            local URL="$1" NAME="$2"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            sleep 1
            # Pass phone directly in URL for auto-login
            local URL_WITH_PHONE="${URL}?phone=${PHONE}"
            xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" "flutter.screenshot_url" "$URL_WITH_PHONE"
            xcrun simctl launch "$UDID" "$BUNDLE_ID"
            sleep 28
            xcrun simctl io "$UDID" screenshot "$OUTDIR/${NAME}.png" \
              || (sleep 10 && xcrun simctl io "$UDID" screenshot "$OUTDIR/${NAME}.png")
          }

          take_screenshot "$BASE_URL/"          "1_home"
          take_screenshot "$BASE_URL/catalogo"  "2_catalogo"
          take_screenshot "$BASE_URL/catalogo"  "3_detalle"
          take_screenshot "$BASE_URL/pedidos"   "4_pedidos"
          take_screenshot "$BASE_URL/perfil"    "5_perfil"

          xcrun simctl shutdown "$UDID"
          xcrun simctl delete "$UDID"
      - name: Screenshots - iPad Pro 12.9" (2da gen)
        script: |
          xcrun simctl shutdown all 2>/dev/null || true

          echo "=== Available iOS Runtimes ==="
          xcrun simctl list runtimes available | grep iOS || true
          echo "=== All iPad Device Types ==="
          xcrun simctl list devicetypes | grep -i ipad || true
          echo "=============================="

          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "
          import sys, json
          rts = [r for r in json.load(sys.stdin)['runtimes'] if 'iOS' in r['name'] and r['isAvailable']]
          if not rts: sys.exit(1)
          print(sorted(rts, key=lambda x: x['version'])[-1]['identifier'])
          ") || { echo "ERROR: No iOS runtime — skipping iPad 12.9 screenshots"; exit 0; }
          echo "Runtime: $RUNTIME"

          DEVICE_TYPE=""
          for CANDIDATE in \
              "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M4" \
              "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-12-9-inch-6th-generation" \
              "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-12-9-inch-5th-generation" \
              "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-12-9-inch-4th-generation" \
              "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-12-9-inch-3rd-generation" \
              "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-12-9-inch-2nd-generation"; do
            if xcrun simctl list devicetypes | grep -qF "$CANDIDATE"; then
              DEVICE_TYPE="$CANDIDATE"
              echo "Selected: $DEVICE_TYPE"
              break
            fi
          done

          if [ -z "$DEVICE_TYPE" ]; then
            DEVICE_TYPE=$(xcrun simctl list devicetypes | grep "iPad Pro" | \
              grep -oE "com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+" | sort -r | head -1)
            echo "Fallback device type: $DEVICE_TYPE"
          fi

          if [ -z "$DEVICE_TYPE" ]; then
            echo "ERROR: No iPad device type available — skipping iPad 12.9 screenshots"
            exit 0
          fi

          UDID=$(xcrun simctl create "ss-ipad-129" "$DEVICE_TYPE" "$RUNTIME" 2>&1)
          echo "Create result: $UDID"
          if ! echo "$UDID" | grep -qE '^[0-9A-Fa-f-]{36}$'; then
            echo "ERROR: Invalid UDID from simctl create — skipping iPad 12.9 screenshots"
            exit 0
          fi

          xcrun simctl boot "$UDID" || { echo "Boot failed — skipping"; xcrun simctl delete "$UDID" 2>/dev/null; exit 0; }
          timeout 600 xcrun simctl bootstatus "$UDID" -b || { echo "Bootstatus timeout — skipping"; xcrun simctl delete "$UDID" 2>/dev/null; exit 0; }

          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app || {
            echo "ERROR: Install failed — app may not support iPad simulator (check UIDeviceFamily in Info.plist)"
            xcrun simctl shutdown "$UDID" 2>/dev/null
            xcrun simctl delete "$UDID" 2>/dev/null
            exit 0
          }

          OUTDIR="$CM_BUILD_DIR/screenshots/ipad_129"
          mkdir -p "$OUTDIR"

          # Pre-grant notification permission to avoid popup blocking screenshots
          xcrun simctl privacy "$UDID" grant notifications "$BUNDLE_ID" 2>/dev/null || true

          take_screenshot() {
            local URL="$1" NAME="$2"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            sleep 1
            # Pass phone directly in URL for auto-login
            local URL_WITH_PHONE="${URL}?phone=${PHONE}"
            xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" "flutter.screenshot_url" "$URL_WITH_PHONE"
            xcrun simctl launch "$UDID" "$BUNDLE_ID"
            sleep 30
            xcrun simctl io "$UDID" screenshot "$OUTDIR/${NAME}.png" \
              || (sleep 15 && xcrun simctl io "$UDID" screenshot "$OUTDIR/${NAME}.png")
          }

          take_screenshot "$BASE_URL/"          "1_home"
          take_screenshot "$BASE_URL/catalogo"  "2_catalogo"
          take_screenshot "$BASE_URL/catalogo"  "3_detalle"
          take_screenshot "$BASE_URL/pedidos"   "4_pedidos"
          take_screenshot "$BASE_URL/perfil"    "5_perfil"

          xcrun simctl shutdown "$UDID"
          xcrun simctl delete "$UDID"
      - name: Screenshots - iPad Pro 13" (M4)
        script: |
          xcrun simctl shutdown all 2>/dev/null || true

          echo "=== All iPad Device Types ==="
          xcrun simctl list devicetypes | grep -i ipad || true
          echo "=============================="

          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "
          import sys, json
          rts = [r for r in json.load(sys.stdin)['runtimes'] if 'iOS' in r['name'] and r['isAvailable']]
          if not rts: sys.exit(1)
          print(sorted(rts, key=lambda x: x['version'])[-1]['identifier'])
          ") || { echo "ERROR: No iOS runtime — skipping iPad 13 screenshots"; exit 0; }
          echo "Runtime: $RUNTIME"

          DEVICE_TYPE=""
          for CANDIDATE in \
              "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M4" \
              "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M2" \
              "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-12-9-inch-6th-generation" \
              "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-12-9-inch-5th-generation"; do
            if xcrun simctl list devicetypes | grep -qF "$CANDIDATE"; then
              DEVICE_TYPE="$CANDIDATE"
              echo "Selected: $DEVICE_TYPE"
              break
            fi
          done

          if [ -z "$DEVICE_TYPE" ]; then
            DEVICE_TYPE=$(xcrun simctl list devicetypes | grep "iPad Pro" | \
              grep -oE "com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+" | sort -r | head -1)
            echo "Fallback device type: $DEVICE_TYPE"
          fi

          if [ -z "$DEVICE_TYPE" ]; then
            echo "ERROR: No iPad device type available — skipping iPad 13 screenshots"
            exit 0
          fi

          UDID=$(xcrun simctl create "ss-ipad-13" "$DEVICE_TYPE" "$RUNTIME" 2>&1)
          echo "Create result: $UDID"
          if ! echo "$UDID" | grep -qE '^[0-9A-Fa-f-]{36}$'; then
            echo "ERROR: Invalid UDID from simctl create — skipping iPad 13 screenshots"
            exit 0
          fi

          xcrun simctl boot "$UDID" || { echo "Boot failed — skipping"; xcrun simctl delete "$UDID" 2>/dev/null; exit 0; }
          timeout 600 xcrun simctl bootstatus "$UDID" -b || { echo "Bootstatus timeout — skipping"; xcrun simctl delete "$UDID" 2>/dev/null; exit 0; }

          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app || {
            echo "ERROR: Install failed — app may not support iPad simulator (check UIDeviceFamily in Info.plist)"
            xcrun simctl shutdown "$UDID" 2>/dev/null
            xcrun simctl delete "$UDID" 2>/dev/null
            exit 0
          }

          OUTDIR="$CM_BUILD_DIR/screenshots/ipad_13"
          mkdir -p "$OUTDIR"

          # Pre-grant notification permission to avoid popup blocking screenshots
          xcrun simctl privacy "$UDID" grant notifications "$BUNDLE_ID" 2>/dev/null || true

          take_screenshot() {
            local URL="$1" NAME="$2"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            sleep 1
            # Pass phone directly in URL for auto-login
            local URL_WITH_PHONE="${URL}?phone=${PHONE}"
            xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" "flutter.screenshot_url" "$URL_WITH_PHONE"
            xcrun simctl launch "$UDID" "$BUNDLE_ID"
