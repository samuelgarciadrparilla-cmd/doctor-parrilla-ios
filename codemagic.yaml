workflows:
  ios-release:
    name: iOS Release to App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
        - firebase_credentials
      vars:
        BUNDLE_ID: "com.drparrilla.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Inject GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - drparrillaparaguay@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

  android-release:
    name: Android Release to Play Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      groups:
        - firebase_credentials
        - android_signing
      vars:
        PACKAGE_NAME: "com.drparrilla.paraguay"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Inject google-services.json
        script: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
      - name: Inject keystore and key.properties
        script: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-key.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/upload-key.jks
          EOF
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate launcher icons
        script: |
          flutter pub run flutter_launcher_icons
      - name: Build AAB
        script: |
          flutter build appbundle --release
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - drparrillaparaguay@gmail.com
        notify:
          success: true
          failure: true

  screenshots:
    name: App Store Screenshots
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase_credentials
      vars:
        BUNDLE_ID: "com.drparrilla.app"
        PHONE: "+5950991123456"
        BASE_URL: "https://drparrillaparaguay.com"
    scripts:
      - name: Inject GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build for simulator
        script: |
          flutter build ios --simulator
      - name: Screenshots - iPhone 16 Pro Max (6.9")
        script: |
          set -e
          xcrun simctl shutdown all 2>/dev/null || true
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "
          import sys, json
          rts = [r for r in json.load(sys.stdin)['runtimes'] if 'iOS' in r['name'] and r['isAvailable']]
          print(sorted(rts, key=lambda x: x['version'])[-1]['identifier'])
          ")
          UDID=$(xcrun simctl create "ss-69" "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app

          OUTDIR="$CM_BUILD_DIR/screenshots/iphone_69"
          mkdir -p "$OUTDIR"

          take_screenshot() {
            local URL="$1" NAME="$2"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            sleep 1
            xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" "flutter.user_phone" "$PHONE"
            xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" "flutter.screenshot_url" "$URL"
            xcrun simctl launch "$UDID" "$BUNDLE_ID"
            sleep 28
            xcrun simctl io "$UDID" screenshot "$OUTDIR/${NAME}.png" \
              || (sleep 10 && xcrun simctl io "$UDID" screenshot "$OUTDIR/${NAME}.png")
          }

          take_screenshot "$BASE_URL/"          "1_home"
          take_screenshot "$BASE_URL/catalogo"  "2_catalogo"
          take_screenshot "$BASE_URL/catalogo"  "3_detalle"
          take_screenshot "$BASE_URL/pedidos"   "4_pedidos"
          take_screenshot "$BASE_URL/perfil"    "5_perfil"

          xcrun simctl shutdown "$UDID"
          xcrun simctl delete "$UDID"
      - name: Screenshots - iPhone 11 Pro Max (6.5")
        script: |
          set -e
          xcrun simctl shutdown all 2>/dev/null || true
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "
          import sys, json
          rts = [r for r in json.load(sys.stdin)['runtimes'] if 'iOS' in r['name'] and r['isAvailable']]
          print(sorted(rts, key=lambda x: x['version'])[-1]['identifier'])
          ")
          UDID=$(xcrun simctl create "ss-65" "com.apple.CoreSimulator.SimDeviceType.iPhone-11-Pro-Max" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app

          OUTDIR="$CM_BUILD_DIR/screenshots/iphone_65"
          mkdir -p "$OUTDIR"

          take_screenshot() {
            local URL="$1" NAME="$2"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            sleep 1
            xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" "flutter.user_phone" "$PHONE"
            xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" "flutter.screenshot_url" "$URL"
            xcrun simctl launch "$UDID" "$BUNDLE_ID"
            sleep 28
            xcrun simctl io "$UDID" screenshot "$OUTDIR/${NAME}.png" \
              || (sleep 10 && xcrun simctl io "$UDID" screenshot "$OUTDIR/${NAME}.png")
          }

          take_screenshot "$BASE_URL/"          "1_home"
          take_screenshot "$BASE_URL/catalogo"  "2_catalogo"
          take_screenshot "$BASE_URL/catalogo"  "3_detalle"
          take_screenshot "$BASE_URL/pedidos"   "4_pedidos"
          take_screenshot "$BASE_URL/perfil"    "5_perfil"

          xcrun simctl shutdown "$UDID"
          xcrun simctl delete "$UDID"
      - name: Screenshots - iPad Pro 12.9" (2da gen)
        script: |
          # NO set -e — queremos seguir aunque iPad falle, para que el step iPad 13" y CHECKLIST.md corran igual.
          xcrun simctl shutdown all 2>/dev/null || true
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "
          import sys, json
          rts = [r for r in json.load(sys.stdin)['runtimes'] if 'iOS' in r['name'] and r['isAvailable']]
          print(sorted(rts, key=lambda x: x['version'])[-1]['identifier'])
          " 2>/dev/null)
          echo "RUNTIME=$RUNTIME"
          echo "=== Available iPad types ==="
          xcrun simctl list devicetypes | grep -i ipad || true
          echo "==========================="
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c "
          import sys, json
          types = json.load(sys.stdin)['devicetypes']
          candidates = [t for t in types if 'iPad Pro' in t['name']]
          large = [t for t in candidates if any(s in t['name'] for s in ['13','12.9','12-9','11'])]
          pool = large if large else candidates
          if pool:
              pool.sort(key=lambda x: x['name'], reverse=True)
              print(pool[0]['identifier'])
          else:
              ipads = [t for t in types if 'iPad' in t['name']]
              if ipads: print(ipads[0]['identifier'])
          " 2>/dev/null)
          echo "DEVICE_TYPE=$DEVICE_TYPE"

          if [ -z "$DEVICE_TYPE" ] || [ -z "$RUNTIME" ]; then
            echo "WARN: no iPad device type or runtime detectable — skipping iPad 12.9 screenshots"
            exit 0
          fi

          UDID=$(xcrun simctl create "ss-ipad-129" "$DEVICE_TYPE" "$RUNTIME" 2>&1)
          if [ -z "$UDID" ] || [[ "$UDID" == *"Error"* ]] || [[ "$UDID" == *"Invalid"* ]]; then
            echo "WARN: simctl create failed: $UDID"
            exit 0
          fi
          echo "UDID=$UDID"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app || { echo "WARN install failed"; xcrun simctl delete "$UDID" || true; exit 0; }

          OUTDIR="$CM_BUILD_DIR/screenshots/ipad_129"
          mkdir -p "$OUTDIR"

          take_screenshot() {
            local URL="$1" NAME="$2"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            sleep 1
            xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" "flutter.user_phone" "$PHONE" || true
            xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" "flutter.screenshot_url" "$URL" || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" || true
            sleep 30
            xcrun simctl io "$UDID" screenshot "$OUTDIR/${NAME}.png" \
              || (sleep 15 && xcrun simctl io "$UDID" screenshot "$OUTDIR/${NAME}.png") \
              || echo "WARN: screenshot $NAME failed"
          }

          take_screenshot "$BASE_URL/"          "1_home"
          take_screenshot "$BASE_URL/catalogo"  "2_catalogo"
          take_screenshot "$BASE_URL/catalogo"  "3_detalle"
          take_screenshot "$BASE_URL/pedidos"   "4_pedidos"
          take_screenshot "$BASE_URL/perfil"    "5_perfil"

          xcrun simctl shutdown "$UDID" || true
          xcrun simctl delete "$UDID" || true
          exit 0
      - name: Screenshots - iPad Pro 13" (M4)
        script: |
          # NO set -e — defensive: skip gracefully si algo falla.
          xcrun simctl shutdown all 2>/dev/null || true
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "
          import sys, json
          rts = [r for r in json.load(sys.stdin)['runtimes'] if 'iOS' in r['name'] and r['isAvailable']]
          print(sorted(rts, key=lambda x: x['version'])[-1]['identifier'])
          " 2>/dev/null)
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c "
          import sys, json
          types = json.load(sys.stdin)['devicetypes']
          candidates = [t for t in types if 'iPad Pro' in t['name']]
          large = [t for t in candidates if any(s in t['name'] for s in ['13','12.9','12-9'])]
          pool = large if large else candidates
          if pool:
              pool.sort(key=lambda x: x['name'], reverse=True)
              print(pool[0]['identifier'])
          else:
              ipads = [t for t in types if 'iPad' in t['name']]
              if ipads: print(ipads[0]['identifier'])
          " 2>/dev/null)
          echo "RUNTIME=$RUNTIME"
          echo "DEVICE_TYPE=$DEVICE_TYPE"

          if [ -z "$DEVICE_TYPE" ] || [ -z "$RUNTIME" ]; then
            echo "WARN: no iPad device type or runtime — skipping iPad 13 screenshots"
            exit 0
          fi

          UDID=$(xcrun simctl create "ss-ipad-13" "$DEVICE_TYPE" "$RUNTIME" 2>&1)
          if [ -z "$UDID" ] || [[ "$UDID" == *"Error"* ]] || [[ "$UDID" == *"Invalid"* ]]; then
            echo "WARN: simctl create failed: $UDID"
            exit 0
          fi
          echo "UDID=$UDID"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app || { echo "WARN install failed"; xcrun simctl delete "$UDID" || true; exit 0; }

          OUTDIR="$CM_BUILD_DIR/screenshots/ipad_13"
          mkdir -p "$OUTDIR"

          take_screenshot() {
            local URL="$1" NAME="$2"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            sleep 1
            xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" "flutter.user_phone" "$PHONE" || true
            xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" "flutter.screenshot_url" "$URL" || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" || true
            sleep 30
            xcrun simctl io "$UDID" screenshot "$OUTDIR/${NAME}.png" \
              || (sleep 15 && xcrun simctl io "$UDID" screenshot "$OUTDIR/${NAME}.png") \
              || echo "WARN: screenshot $NAME failed"
          }

          take_screenshot "$BASE_URL/"          "1_home"
          take_screenshot "$BASE_URL/catalogo"  "2_catalogo"
          take_screenshot "$BASE_URL/catalogo"  "3_detalle"
          take_screenshot "$BASE_URL/pedidos"   "4_pedidos"
          take_screenshot "$BASE_URL/perfil"    "5_perfil"

          xcrun simctl shutdown "$UDID" || true
          xcrun simctl delete "$UDID" || true
          exit 0
      - name: Generate CHECKLIST.md
        script: |
          OUTDIR="$CM_BUILD_DIR/screenshots"
          cat > "$OUTDIR/CHECKLIST.md" <<'EOF'
          # Screenshots CHECKLIST — Dr. Parrilla App Store

          ## Dispositivos

          ### iPhone 6.9" (16 Pro Max)
          - [ ] 1_home.png
          - [ ] 2_catalogo.png
          - [ ] 3_detalle.png
          - [ ] 4_pedidos.png
          - [ ] 5_perfil.png

          ### iPhone 6.5" (11 Pro Max)
          - [ ] 1_home.png
          - [ ] 2_catalogo.png
          - [ ] 3_detalle.png
          - [ ] 4_pedidos.png
          - [ ] 5_perfil.png

          ### iPad Pro 12.9" (2da gen)
          - [ ] 1_home.png
          - [ ] 2_catalogo.png
          - [ ] 3_detalle.png
          - [ ] 4_pedidos.png
          - [ ] 5_perfil.png

          ### iPad Pro 13" (M4)
          - [ ] 1_home.png
          - [ ] 2_catalogo.png
          - [ ] 3_detalle.png
          - [ ] 4_pedidos.png
          - [ ] 5_perfil.png

          ## URLs usadas
          - Home: https://drparrillaparaguay.com/
          - Catálogo: https://drparrillaparaguay.com/catalogo
          - Detalle: https://drparrillaparaguay.com/catalogo
          - Pedidos: https://drparrillaparaguay.com/pedidos
          - Perfil: https://drparrillaparaguay.com/perfil

          ## Notas
          - Usuario de prueba: +5950991123456
          - Detalle usa /catalogo — actualizar URL si se necesita producto específico
          EOF
    artifacts:
      - $CM_BUILD_DIR/screenshots/**
