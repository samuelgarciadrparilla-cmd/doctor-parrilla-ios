workflows:
  ios-release:
    name: iOS Release to App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
        - firebase_credentials
      vars:
        BUNDLE_ID: "com.drparrilla.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Inject GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --build-name=1.3.6 \
            --build-number=136
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - drparrillaparaguay@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

  android-release:
    name: Android Release to Play Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      groups:
        - firebase_credentials
        - android_signing
      vars:
        PACKAGE_NAME: "com.drparrilla.paraguay"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Inject google-services.json
        script: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
      - name: Inject keystore and key.properties
        script: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-key.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/upload-key.jks
          EOF
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate launcher icons
        script: |
          flutter pub run flutter_launcher_icons
      - name: Build AAB
        script: |
          flutter build appbundle \
            --release \
            --build-name=1.3.6 \
            --build-number=136
      - name: Build APK
        script: |
          flutter build apk \
            --release \
            --build-name=1.3.6 \
            --build-number=136
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - drparrillaparaguay@gmail.com
        notify:
          success: true
          failure: true

  screenshots:
    name: App Store Screenshots
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase_credentials
      vars:
        BUNDLE_ID: "com.drparrilla.app"
    scripts:
      - name: Inject GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build for simulator
        script: |
          flutter build ios --simulator
      - name: Screenshot - iPhone 16 Pro Max (6.9")
        script: |
          xcrun simctl shutdown all 2>/dev/null || true
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "
          import sys, json
          runtimes = [r for r in json.load(sys.stdin)['runtimes'] if 'iOS' in r['name'] and r['isAvailable']]
          print(sorted(runtimes, key=lambda x: x['version'])[-1]['identifier'])
          ")
          UDID=$(xcrun simctl create "screenshot-69" "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 20
          mkdir -p "$CM_BUILD_DIR/screenshots"
          xcrun simctl io "$UDID" screenshot "$CM_BUILD_DIR/screenshots/screenshot_69.png" \
            || (sleep 10 && xcrun simctl io "$UDID" screenshot "$CM_BUILD_DIR/screenshots/screenshot_69.png")
          xcrun simctl shutdown "$UDID"
          xcrun simctl delete "$UDID"
      - name: Screenshot - iPhone 11 Pro Max (6.5")
        script: |
          xcrun simctl shutdown all 2>/dev/null || true
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "
          import sys, json
          runtimes = [r for r in json.load(sys.stdin)['runtimes'] if 'iOS' in r['name'] and r['isAvailable']]
          print(sorted(runtimes, key=lambda x: x['version'])[-1]['identifier'])
          ")
          UDID=$(xcrun simctl create "screenshot-65" "com.apple.CoreSimulator.SimDeviceType.iPhone-11-Pro-Max" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 20
          mkdir -p "$CM_BUILD_DIR/screenshots"
          xcrun simctl io "$UDID" screenshot "$CM_BUILD_DIR/screenshots/screenshot_65.png" \
            || (sleep 10 && xcrun simctl io "$UDID" screenshot "$CM_BUILD_DIR/screenshots/screenshot_65.png")
          xcrun simctl shutdown "$UDID"
          xcrun simctl delete "$UDID"
      - name: Screenshot - iPad Pro 12.9" (6th gen)
        script: |
          xcrun simctl shutdown all 2>/dev/null || true
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "
          import sys, json
          runtimes = [r for r in json.load(sys.stdin)['runtimes'] if 'iOS' in r['name'] and r['isAvailable']]
          print(sorted(runtimes, key=lambda x: x['version'])[-1]['identifier'])
          ")
          UDID=$(xcrun simctl create "screenshot-ipad-129" "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-12-9-inch-6th-generation" "$RUNTIME")
          xcrun simctl boot "$UDID"
          timeout 600 xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 25
          mkdir -p "$CM_BUILD_DIR/screenshots"
          sleep 20
          xcrun simctl io "$UDID" screenshot "$CM_BUILD_DIR/screenshots/screenshot_ipad_129.png" \
            || (sleep 15 && xcrun simctl io "$UDID" screenshot "$CM_BUILD_DIR/screenshots/screenshot_ipad_129.png")
          xcrun simctl shutdown "$UDID"
          xcrun simctl delete "$UDID"
      - name: Screenshot - iPad Pro 13" (M4)
        script: |
          xcrun simctl shutdown all 2>/dev/null || true
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "
          import sys, json
          runtimes = [r for r in json.load(sys.stdin)['runtimes'] if 'iOS' in r['name'] and r['isAvailable']]
          print(sorted(runtimes, key=lambda x: x['version'])[-1]['identifier'])
          ")
          UDID=$(xcrun simctl create "screenshot-ipad-13" "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M4" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 25
          mkdir -p "$CM_BUILD_DIR/screenshots"
          xcrun simctl io "$UDID" screenshot "$CM_BUILD_DIR/screenshots/screenshot_ipad_13.png" \
            || (sleep 10 && xcrun simctl io "$UDID" screenshot "$CM_BUILD_DIR/screenshots/screenshot_ipad_13.png")
          xcrun simctl shutdown "$UDID"
          xcrun simctl delete "$UDID"
    artifacts:
      - $CM_BUILD_DIR/screenshots/*.png
